[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "1.0.0"
description = "Multimodal Document Intelligence Platform"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["backend", "."]
include = ["ai_engine*", "app*"]